<div

>

  <div class="loading">

  </div>

<script>


/* ============================================================
   GOOGLE APPS SCRIPT URL
   ============================================================ */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwHj46VUw8DZxGSC-uk-VkBtRTqekfuGybtMbrz_-NNP5F_OcKtWp57R-MIgFLeF-c/exec";


/* ============================================================
   FAMILY
   ============================================================ */

const FAMILY = [

  "Mama",
  "Baba",
  "Menna",
  "Rahma",
  "Ahmed",
  "Ibrahim",
  "Ismail",
  "Mousa"

];


/* ============================================================
   HIJRI MONTH NAMES
   ============================================================ */

const HIJRI_MONTHS = [

  "Muharram",
  "Safar",
  "Rabi' al-awwal",
  "Rabi' al-thani",
  "Jumada al-awwal",
  "Jumada al-thani",
  "Rajab",
  "Sha'ban",
  "Ramadan",
  "Shawwal",
  "Dhu al-Qi'dah",
  "Dhu al-Hijjah"

];


/* ============================================================
   STATE
   ============================================================ */

let state = {

  name:null,

  hijri:null,

  monthKey:"",

  monthDays:null,

  rows:[],

  busy:false,

  refreshing:false,

  error:null,

  lastUpdated:null

};


let callbackCounter = 0;


/* ============================================================
   JSONP API
   ============================================================ */

function api(params){

  return new Promise(
    (resolve,reject)=>{

      const callbackName =
        "khatmaCallback_" +
        Date.now() +
        "_" +
        callbackCounter++;


      const script =
        document.createElement("script");


      let finished = false;

      let timer;


      function cleanup(){

        clearTimeout(timer);

        try{

          delete window[callbackName];

        }catch(e){}

        script.remove();

      }


      timer = setTimeout(
        ()=>{

          if(finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "Request timed out"
            )
          );

        },
        20000
      );


      window[callbackName] =
        function(data){

          if(finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function(){

          if(finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "Google Apps Script request failed"
            )
          );

        };


      const query =
        Object.entries(params)

          .map(
            ([key,value]) =>
              encodeURIComponent(key) +
              "=" +
              encodeURIComponent(value)
          )

          .join("&");


      /*
       IMPORTANT:
       The backend expects "pin".
       */

      script.src =
        SCRIPT_URL +
        "?" +
        query +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


/* ============================================================
   HIJRI DATE
   ============================================================ */

function getHijri(date){

  const parts =
    new Intl.DateTimeFormat(
      "en-u-ca-islamic-umalqura",
      {
        day:"numeric",
        month:"numeric",
        year:"numeric"
      }
    ).formatToParts(date);


  const map = {};


  parts.forEach(
    p => {

      map[p.type] = p.value;

    }
  );


  return {

    day:Number(map.day),

    month:Number(map.month),

    year:Number(map.year)

  };

}


/* ============================================================
   DETERMINE CURRENT HIJRI MONTH LENGTH
   ============================================================ */

function daysInMonth(){

  const today =
    new Date();


  const current =
    getHijri(today);


  /*
   Find the first day of the next Hijri month.
   The day before it is the final day of
   the current month.
   */

  for(
    let offset = 1;
    offset <= 31;
    offset++
  ){

    const testDate =
      new Date(today);


    testDate.setDate(
      today.getDate() + offset
    );


    const h =
      getHijri(testDate);


    if(
      h.month !== current.month ||
      h.year !== current.year
    ){

      return offset - 1;

    }

  }


  return 30;

}


/* ============================================================
   LOCAL STORAGE
   ============================================================ */

function loadName(){

  try{

    state.name =
      localStorage.getItem(
        "khatma_name"
      );

  }catch(e){

    state.name = null;

  }

}


function saveName(name){

  state.name = name;

  try{

    localStorage.setItem(
      "khatma_name",
      name
    );

  }catch(e){}

  render();

}


function changeName(){

  state.name = null;

  try{

    localStorage.removeItem(
      "khatma_name"
    );

  }catch(e){}

  render();

}


/* ============================================================
   LOGIN
   ============================================================ */

function showLogin(message){

  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = `

    <div class="lock-screen">

      <div class="lock-icon">
        🌙
      </div>

      <p class="title">
        Family Khatma
      </p>

      <p>
        Enter the family PIN
      </p>

      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        placeholder="PIN"
      >

      <button
        onclick="login()"
      >
        Unlock
      </button>

      ${
        message
        ? `
          <div class="lock-error">
            ${message}
          </div>
        `
        : ""
      }

    </div>

  `;


  const input =
    document.getElementById(
      "pinInput"
    );


  input.focus();


  input.addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        login();

      }

    }
  );

}


/* ============================================================
   LOGIN
   ============================================================ */

async function login(){

  const input =
    document.getElementById(
      "pinInput"
    );


  const pin =
    input.value.trim();


  if(!pin){

    showLogin(
      "Please enter the PIN."
    );

    return;

  }


  try{

    const result =
      await api({

        action:"read",

        monthKey:"__login__",

        /*
         Backend expects "pin".
         */

        pin:pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      showLogin(
        "That's not the right PIN."
      );

      return;

    }


    if(
      result &&
      result.error
    ){

      showLogin(
        "Server error: " +
        result.error
      );

      return;

    }


    try{

      localStorage.setItem(
        "khatma_pin",
        pin
      );

    }catch(e){}


    await load();

  }catch(e){

    showLogin(
      "Could not connect to the tracker."
    );

  }

}


/* ============================================================
   LOAD FROM GOOGLE SHEETS
   ============================================================

   IMPORTANT:

   This function ALWAYS replaces state.rows
   with the data returned by Google Sheets.

   It never merges local data into the Sheet data.

   Therefore Google Sheets is the source of truth.
   ============================================================ */

async function load(){

  if(state.refreshing){

    return;

  }


  state.refreshing = true;


  try{

    loadName();


    state.hijri =
      getHijri(
        new Date()
      );


    state.monthKey =
      state.hijri.year +
      "-" +
      String(
        state.hijri.month
      ).padStart(
        2,
        "0"
      );


    state.monthDays =
      daysInMonth();


    let pin = null;


    try{

      pin =
        localStorage.getItem(
          "khatma_pin"
        );

    }catch(e){}


    if(!pin){

      state.refreshing = false;

      showLogin();

      return;

    }


    /*
     ALWAYS perform a fresh read.
     */

    const result =
      await api({

        action:"read",

        monthKey:
          state.monthKey,

        pin:pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      try{

        localStorage.removeItem(
          "khatma_pin"
        );

      }catch(e){}

      state.refreshing = false;

      showLogin(
        "Your PIN is no longer valid."
      );

      return;

    }


    if(
      result &&
      result.error
    ){

      state.error =
        result.error;

    }else{

      /*
       CRITICAL:

       Replace the entire local dataset
       with what Google Sheets returned.

       This means changes made by ANY family
       member are reflected here.
       */

      state.rows =
        Array.isArray(result)
        ? result
        : [];

      state.error = null;

      state.lastUpdated =
        new Date();

    }


  }catch(e){

    state.error =
      "Could not fetch the latest data from Google Sheets.";

  }


  state.refreshing = false;

  render();

}


/* ============================================================
   MANUAL REFRESH
   ============================================================ */

async function refreshNow(){

  if(
    state.busy ||
    state.refreshing
  ){

    return;

  }


  await load();

}


/* ============================================================
   CHECK WHETHER PERSON HAS READ
   ============================================================ */

function hasRead(day,name){

  return state.rows.some(
    row =>

      Number(row.day) ===
      Number(day)

      &&

      String(row.name) ===
      String(name)

  );

}


/* ============================================================
   CHECK IN
   ============================================================ */

async function checkin(){

  if(
    !state.name ||
    state.busy
  ){

    return;

  }


  let pin = null;


  try{

    pin =
      localStorage.getItem(
        "khatma_pin"
      );

  }catch(e){}


  if(!pin){

    showLogin();

    return;

  }


  const day =
    state.hijri.day;


  state.busy = true;

  state.error = null;

  render();


  try{

    /*
     Write to Google Sheets.

     The backend returns the Sheet data,
     but we deliberately DO NOT rely on it.
     */

    const result =
      await api({

        action:"checkin",

        monthKey:
          state.monthKey,

        day:day,

        name:state.name,

        pin:pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      try{

        localStorage.removeItem(
          "khatma_pin"
        );

      }catch(e){}

      state.busy = false;

      showLogin(
        "Your PIN is no longer valid."
      );

      return;

    }


    if(
      result &&
      result.error
    ){

      state.error =
        result.error;

      state.busy = false;

      render();

      return;

    }


    /*
     IMPORTANT:

     The write succeeded.

     Now fetch the Sheet again.
     This guarantees the UI displays
     the actual server state.
     */

    state.busy = false;

    await load();

    return;


  }catch(e){

    state.error =
      "Could not save your check-in. " +
      "Please try again.";

  }


  state.busy = false;

  render();

}


/* ============================================================
   UNDO
   ============================================================ */

async function undo(){

  if(
    !state.name ||
    state.busy
  ){

    return;

  }


  let pin = null;


  try{

    pin =
      localStorage.getItem(
        "khatma_pin"
      );

  }catch(e){}


  if(!pin){

    showLogin();

    return;

  }


  const day =
    state.hijri.day;


  state.busy = true;

  state.error = null;

  render();


  try{

    /*
     Use the dedicated backend undo action.
     */

    const result =
      await api({

        action:"undo",

        monthKey:
          state.monthKey,

        day:day,

        name:state.name,

        pin:pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      try{

        localStorage.removeItem(
          "khatma_pin"
        );

      }catch(e){}

      state.busy = false;

      showLogin(
        "Your PIN is no longer valid."
      );

      return;

    }


    if(
      result &&
      result.error
    ){

      state.error =
        result.error;

      state.busy = false;

      render();

      return;

    }


    /*
     Re-read Google Sheets after undo.
     */

    state.busy = false;

    await load();

    return;


  }catch(e){

    state.error =
      "Could not undo the check-in. " +
      "Please try again.";

  }


  state.busy = false;

  render();

}


/* ============================================================
   TODAY'S FAMILY STATUS
   ============================================================ */

function renderToday(){

  const count =
    FAMILY.filter(
      name =>
        hasRead(
          state.hijri.day,
          name
        )
    ).length;


  const total =
    FAMILY.length;


  const percent =
    total
      ? Math.round(
          count /
          total *
          100
        )
      : 0;


  return `

    <div class="family-summary">

      <div class="family-count">

        <div class="family-count-number">
          ${count}/${total}
        </div>

        <div class="family-count-label">
          read today
        </div>

      </div>


      <div class="family-bar">

        <div
          class="family-bar-fill"
          style="width:${percent}%"
        ></div>

      </div>

    </div>


    <div class="family-grid">

      ${
        FAMILY.map(
          name => {

            const read =
              hasRead(
                state.hijri.day,
                name
              );


            const initials =
              name
                .split(/\s+/)
                .map(
                  x => x[0]
                )
                .join("")
                .slice(0,2)
                .toUpperCase();


            return `

              <div
                class="chip ${
                  read
                    ? "read"
                    : ""
                }"
              >

                <span class="avatar">
                  ${initials}
                </span>

                ${name}

              </div>

            `;

          }
        ).join("")
      }

    </div>

  `;

}


/* ============================================================
   MONTH PROGRESS
   ============================================================ */

function renderProgress(){

  const totalDays =
    state.monthDays;


  const total =
    totalDays *
    FAMILY.length;


  /*
   Count unique day/person combinations.
   */

  const uniqueKeys =
    new Set();


  state.rows.forEach(
    row => {

      const day =
        Number(row.day);

      const name =
        String(row.name);


      if(
        day >= 1 &&
        day <= totalDays &&
        FAMILY.includes(name)
      ){

        uniqueKeys.add(
          day + "|" + name
        );

      }

    }
  );


  const completed =
    uniqueKeys.size;


  const percent =
    total
      ? Math.round(
          completed /
          total *
          100
        )
      : 0;


  let days = "";


  for(
    let day = 1;
    day <= totalDays;
    day++
  ){

    const isToday =
      day === state.hijri.day;


    const count =
      FAMILY.filter(
        name =>
          hasRead(
            day,
            name
          )
      ).length;


    const dots =
      FAMILY.map(
        name => `

          <div
            class="person-dot ${
              hasRead(day,name)
                ? "read"
                : ""
            }"
            title="${name}"
          ></div>

        `
      ).join("");


    days += `

      <div
        class="day-row ${
          isToday
            ? "today"
            : ""
        }"
      >

        <div class="day-number">
          ${day}
        </div>

        <div class="day-dots">
          ${dots}
        </div>

        <div class="day-total">
          ${count}/${FAMILY.length}
        </div>

      </div>

    `;

  }


  return `

    <div class="progress-header">

      <div>

        <div class="progress-number">
          ${completed}/${total}
        </div>

        <div class="progress-label">
          family check-ins
        </div>

      </div>

      <div class="progress-percent">
        ${percent}%
      </div>

    </div>


    <div class="progress-bar">

      <div
        class="progress-fill"
        style="width:${percent}%"
      ></div>

    </div>


    <div class="day-list">

      ${days}

    </div>

  `;

}


/* ============================================================
   INDIVIDUAL PROGRESS
   ============================================================ */

function renderMembers(){

  const totalDays =
    state.monthDays;


  return FAMILY.map(
    name => {

      const uniqueDays =
        new Set();


      state.rows.forEach(
        row => {

          if(
            String(row.name) ===
            String(name)
          ){

            const day =
              Number(row.day);


            if(
              day >= 1 &&
              day <= totalDays
            ){

              uniqueDays.add(day);

            }

          }

        }
      );


      const count =
        uniqueDays.size;


      const percent =
        totalDays
          ? Math.round(
              count /
              totalDays *
              100
            )
          : 0;


      return `

        <div class="member-row">

          <div class="member-name">
            ${name}
          </div>

          <div class="member-bar">

            <div
              class="member-fill"
              style="width:${percent}%"
            ></div>

          </div>

          <div class="member-total">
            ${count}/${totalDays}
          </div>

        </div>

      `;

    }
  ).join("");

}


/* ============================================================
   LAST UPDATED TEXT
   ============================================================ */

function getLastUpdatedText(){

  if(!state.lastUpdated){

    return "Not loaded yet";

  }


  return (
    "Last synced " +
    state.lastUpdated.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit",
        second:"2-digit"
      }
    )
  );

}


/* ============================================================
   RENDER
   ============================================================ */

function render(){

  const app =
    document.getElementById(
      "app"
    );


  if(!state.hijri){

    app.innerHTML =
      `<div class="loading">Loading…</div>`;

    return;

  }


  const day =
    state.hijri.day;


  const month =
    HIJRI_MONTHS[
      state.hijri.month - 1
    ];


  const read =
    state.name &&
    hasRead(
      day,
      state.name
    );


  let nameBlock;


  if(state.name){

    nameBlock = `

      <div class="you-line">

        Checking in as

        <strong>
          ${state.name}
        </strong>

        ·

        <button
          class="text-button"
          onclick="changeName()"
        >
          not you?
        </button>

      </div>

    `;

  }else{

    nameBlock = `

      <div class="who-label">
        Who's checking in?
      </div>

      <div class="who-grid">

        ${
          FAMILY.map(
            name => `

              <button
                class="who-btn"
                onclick="saveName('${name}')"
              >
                ${name}
              </button>

            `
          ).join("")
        }

      </div>

    `;

  }


  let button;


  if(read){

    button = `

      <button
        class="checkin-btn done ${
          state.busy
            ? "busy"
            : ""
        }"
        onclick="undo()"
        ${state.busy ? "disabled" : ""}
      >

        ${
          state.busy
            ? "Saving…"
            : "✓ Read Juz " + day
        }

      </button>


      <button
        class="undo-btn"
        onclick="undo()"
        ${state.busy ? "disabled" : ""}
      >

        Undo

      </button>

    `;

  }else{

    button = `

      <button
        class="checkin-btn ${
          state.busy
            ? "busy"
            : ""
        }"
        onclick="checkin()"
        ${state.busy ? "disabled" : ""}
      >

        ${
          state.busy
            ? "Saving…"
            : "I read Juz " +
              day +
              " today"
        }

      </button>

    `;

  }


  app.innerHTML = `

    ${
      state.error
        ? `
          <div class="error-banner">
            ${state.error}
          </div>
        `
        : ""
    }


    <div class="top">

      <div class="hijri-date">

        ${month}
        ${state.hijri.year}H
        ·
        Day ${day}

      </div>


      <p class="title">
        Family Khatma
      </p>


      <div class="subtitle">
        One Juz together every day 🤍
      </div>

    </div>


    <div class="card juz-card">

      <div class="juz-label">
        Today's reading
      </div>


      <div class="juz-circle">

        <svg
          width="100"
          height="100"
          viewBox="0 0 112 112"
          style="
            position:absolute;
            top:0;
            left:0;
          "
        >

          <polygon
            points="
              56,4
              66,30
              94,26
              76,48
              100,64
              72,66
              76,94
              56,74
              36,94
              40,66
              12,64
              36,48
              18,26
              46,30
            "
            fill="#F3EFE4"
            stroke="#B8873A"
            stroke-width="2"
          />

        </svg>


        <div class="juz-number">
          ${day}
        </div>

      </div>


      <div class="juz-name">
        Juz ${day}
      </div>


      <a
        class="quran-link"
        href="https://quran.com/en/juz/${day}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read Juz ${day} on Quran.com →
      </a>


      ${button}


      ${nameBlock}

    </div>


    <div class="section-title">
      Today's family
    </div>


    <div class="card">

      ${renderToday()}

    </div>


    <div class="section-title">
      Family progress
    </div>


    <div class="card">

      ${renderProgress()}

    </div>


    <div class="section-title">
      Individual progress
    </div>


    <div class="card">

      <div class="member-list">

        ${renderMembers()}

      </div>

    </div>


    <div class="footer">

      ${state.monthDays} days ·
      ${state.monthDays} Juz

      <br>

      May Allah accept it from all of us 🤍


      <div class="refresh-row">

        <span class="refresh-note">
          ${getLastUpdatedText()}
        </span>

        <button
          class="refresh-button"
          onclick="refreshNow()"
          ${state.refreshing || state.busy ? "disabled" : ""}
        >
          Refresh
        </button>

      </div>


      <button
        class="lock-link"
        onclick="logout()"
      >
        Lock tracker
      </button>

    </div>

  `;

}


/* ============================================================
   LOGOUT
   ============================================================ */

function logout(){

  try{

    localStorage.removeItem(
      "khatma_pin"
    );

  }catch(e){}

  showLogin();

}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

if(
  !SCRIPT_URL ||
  SCRIPT_URL.includes(
    "PASTE_YOUR"
  )
){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <strong>
        Setup needed
      </strong>

      <p>
        Put your Google Apps Script
        Web App URL ending in
        <code>/exec</code>
        into SCRIPT_URL.
      </p>

    </div>

  `;

}else{

  load();

}


/* ============================================================
   AUTOMATIC REFRESH
   ============================================================

   Every 10 seconds the page fetches the
   current month's data directly from
   Google Sheets through Apps Script.

   This means:

   - Your changes appear after saving.
   - Other family members' changes appear
     automatically.
   - The UI does not maintain its own
     authoritative copy of the data.

   Google Sheets remains the source of truth.
   ============================================================ */

setInterval(
  function(){

    if(
      state.hijri &&
      !state.busy &&
      !state.refreshing
    ){

      load();

    }

  },
  10000
);

</script>
