<div
  id="app"
  class="wrap"
>
  <div class="loading">
    Loading Family Khatma…
  </div>

<script>


/* ============================================================
   ONLY CHANGE THIS
   ============================================================ */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzx2hcU_RI_ZIQ4dJVFrZ7mSZJsGQXqonDOm3OYI5MVGfWYLYnfFDxLFk1Xbj-s4JQK/exec";


/* ============================================================
   FAMILY
   ============================================================ */

const FAMILY = [

  "Mama",
  "Baba",
  "Menna",
  "Rahma",
  "Ahmed",
  "Ibrahim",
  "Ismail",
  "Mousa"

];


/* ============================================================
   HIJRI MONTHS
   ============================================================ */

const HIJRI_MONTHS = [

  "Muharram",
  "Safar",
  "Rabi' al-awwal",
  "Rabi' al-thani",
  "Jumada al-awwal",
  "Jumada al-thani",
  "Rajab",
  "Sha'ban",
  "Ramadan",
  "Shawwal",
  "Dhu al-Qi'dah",
  "Dhu al-Hijjah"

];


let state = {

  name:null,

  hijri:null,

  monthKey:"",

  rows:[],

  busy:false,

  refreshing:false,

  error:null,

  lastUpdated:null

};


let callbackCounter = 0;


/* ============================================================
   JSONP API
   ============================================================ */

function api(params){

  return new Promise(
    (resolve,reject)=>{

      const callbackName =
        "khatmaCallback_" +
        Date.now() +
        "_" +
        callbackCounter++;


      const script =
        document.createElement(
          "script"
        );


      let done = false;


      function cleanup(){

        clearTimeout(timer);

        try{

          delete window[
            callbackName
          ];

        }catch(e){}

        script.remove();

      }


      const timer =
        setTimeout(
          ()=>{

            if(done) return;

            done = true;

            cleanup();

            reject(
              new Error(
                "Request timed out"
              )
            );

          },
          20000
        );


      window[callbackName] =
        function(data){

          if(done) return;

          done = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function(){

          if(done) return;

          done = true;

          cleanup();

          reject(
            new Error(
              "Google Apps Script request failed"
            )
          );

        };


      const query =
        Object.entries(params)

          .map(
            ([key,value]) =>
              encodeURIComponent(key) +
              "=" +
              encodeURIComponent(value)
          )

          .join("&");


      script.src =
        SCRIPT_URL +
        "?" +
        query +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


/* ============================================================
   HIJRI DATE
   ============================================================ */

function getHijri(date){

  const parts =
    new Intl.DateTimeFormat(
      "en-u-ca-islamic-umalqura",
      {
        day:"numeric",
        month:"numeric",
        year:"numeric"
      }
    ).formatToParts(date);


  const map = {};


  parts.forEach(
    p => map[p.type] = p.value
  );


  return {

    day:Number(map.day),

    month:Number(map.month),

    year:Number(map.year)

  };

}


/* ============================================================
   MONTH DAYS
   ============================================================ */

function daysInMonth(){

  const today =
    new Date();


  const current =
    getHijri(today);


  const test =
    new Date(today);


  test.setDate(
    today.getDate() +
    (30 - current.day)
  );


  const future =
    getHijri(test);


  return (
    future.month === current.month &&
    future.year === current.year
  )
    ? 30
    : 29;

}


/* ============================================================
   STORAGE
   ============================================================ */

function loadName(){

  try{

    state.name =
      localStorage.getItem(
        "khatma_name"
      );

  }catch(e){

    state.name = null;

  }

}


function saveName(name){

  state.name = name;

  try{

    localStorage.setItem(
      "khatma_name",
      name
    );

  }catch(e){}

  render();

}


function changeName(){

  state.name = null;

  try{

    localStorage.removeItem(
      "khatma_name"
    );

  }catch(e){}

  render();

}


/* ============================================================
   LOGIN
   ============================================================ */

function showLogin(message){

  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = `

    <div class="lock-screen">

      <div class="lock-icon">
        🌙
      </div>

      <p class="title">
        Family Khatma
      </p>

      <p>
        Enter the family PIN
      </p>

      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        placeholder="PIN"
      >

      <button
        onclick="login()"
      >
        Unlock
      </button>

      ${
        message
        ? `
          <div class="lock-error">
            ${message}
          </div>
        `
        : ""
      }

    </div>

  `;


  const input =
    document.getElementById(
      "pinInput"
    );


  input.focus();


  input.addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        login();

      }

    }
  );

}


/* ============================================================
   LOGIN
   ============================================================ */

async function login(){

  const input =
    document.getElementById(
      "pinInput"
    );


  const pin =
    input.value.trim();


  if(!pin){

    showLogin(
      "Please enter the PIN."
    );

    return;

  }


  try{

    const result =
      await api({

        action:"read",

        monthKey:"__login__",

        pin:pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      showLogin(
        "That's not the right PIN."
      );

      return;

    }


    if(
      result &&
      result.error
    ){

      showLogin(
        "Server error: " +
        result.error
      );

      return;

    }


    try{

      localStorage.setItem(
        "khatma_pin",
        pin
      );

    }catch(e){}


    load();

  }catch(e){

    console.error(e);

    showLogin(
      "Could not connect to the tracker."
    );

  }

}


/* ============================================================
   REFRESH FROM GOOGLE SHEET
   ============================================================ */

/*
   IMPORTANT:

   The Google Sheet is the single source of truth.

   This function NEVER modifies the Sheet.

   It only reads the current month's data and
   replaces state.rows with exactly what the
   Sheet returned.
*/

async function refreshFromSheet(){

  if(state.refreshing){

    return false;

  }


  const pin =
    localStorage.getItem(
      "khatma_pin"
    );


  if(!pin){

    showLogin();

    return false;

  }


  state.refreshing = true;


  try{

    const result =
      await api({

        action:"read",

        monthKey:
          state.monthKey,

        pin:pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      try{

        localStorage.removeItem(
          "khatma_pin"
        );

      }catch(e){}


      state.refreshing = false;

      showLogin(
        "Your PIN is no longer valid."
      );

      return false;

    }


    if(
      result &&
      result.error
    ){

      throw new Error(
        result.error
      );

    }


    /*
     Replace the entire local dataset.

     We do NOT merge it.

     We do NOT append to it.

     Whatever Google Sheets says is what
     the UI displays.
    */

    state.rows =
      Array.isArray(result)
      ? result
      : [];


    state.error = null;

    state.lastUpdated =
      new Date();


    state.refreshing = false;


    return true;

  }catch(e){

    console.error(
      "Sheet refresh failed:",
      e
    );


    /*
     IMPORTANT:

     Keep the last known good state.

     Do NOT replace state.rows with [].
    */

    state.error =
      "Could not refresh from Google Sheets.";


    state.refreshing = false;


    return false;

  }

}


/* ============================================================
   LOAD
   ============================================================ */

async function load(){

  loadName();


  state.hijri =
    getHijri(
      new Date()
    );


  state.monthKey =
    state.hijri.year +
    "-" +
    String(
      state.hijri.month
    ).padStart(
      2,
      "0"
    );


  const pin =
    localStorage.getItem(
      "khatma_pin"
    );


  if(!pin){

    showLogin();

    return;

  }


  await refreshFromSheet();


  render();

}


/* ============================================================
   CHECK READ STATUS
   ============================================================ */

function hasRead(
  day,
  name
){

  return state.rows.some(
    row =>
      Number(row.day) ===
        Number(day) &&
      String(row.name) ===
        String(name)
  );

}


/* ============================================================
   CHECK IN
   ============================================================ */

async function checkin(){

  if(
    !state.name ||
    state.busy
  ){

    return;

  }


  const pin =
    localStorage.getItem(
      "khatma_pin"
    );


  if(!pin){

    showLogin();

    return;

  }


  state.busy = true;

  state.error = null;

  render();


  try{

    /*
     Tell Apps Script to toggle this
     person's check-in.

     We DO NOT modify state.rows here.
    */

    const result =
      await api({

        action:"checkin",

        monthKey:
          state.monthKey,

        day:
          state.hijri.day,

        name:
          state.name,

        pin:
          pin

      });


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      localStorage.removeItem(
        "khatma_pin"
      );

      state.busy = false;

      showLogin(
        "Your PIN is no longer valid."
      );

      return;

    }


    /*
     Ignore the returned data.

     Re-read the Sheet explicitly so the
     source of truth is always the Sheet.
    */

    await refreshFromSheet();


  }catch(e){

    console.error(
      "Check-in failed:",
      e
    );


    state.error =
      "Could not save your check-in.";


    /*
     Re-read anyway.

     The request may have succeeded on the
     server even if the response failed.
    */

    await refreshFromSheet();

  }


  state.busy = false;

  render();

}


/* ============================================================
   UNDO
   ============================================================ */

async function undo(){

  if(
    !state.name ||
    state.busy
  ){

    return;

  }


  const pin =
    localStorage.getItem(
      "khatma_pin"
    );


  if(!pin){

    showLogin();

    return;

  }


  state.busy = true;

  state.error = null;

  render();


  try{

    /*
     Your Apps Script uses toggleCheckin().

     Therefore calling "checkin" again for an
     existing row removes it.

     We deliberately use action:"checkin"
     rather than relying on a separate undo
     endpoint.
    */

    await api({

      action:"checkin",

      monthKey:
        state.monthKey,

      day:
        state.hijri.day,

      name:
        state.name,

      pin:
        pin

    });


    /*
     Re-read the Sheet.

     Never remove the row locally.
    */

    await refreshFromSheet();


  }catch(e){

    console.error(
      "Undo failed:",
      e
    );


    state.error =
      "Could not undo the check-in.";


    /*
     The request could still have reached
     Apps Script, so refresh regardless.
    */

    await refreshFromSheet();

  }


  state.busy = false;

  render();

}


/* ============================================================
   TODAY'S FAMILY
   ============================================================ */

function renderToday(){

  const readers =
    FAMILY.filter(
      name =>
        hasRead(
          state.hijri.day,
          name
        )
    );


  const count =
    readers.length;


  const total =
    FAMILY.length;


  const percent =
    total
      ? Math.round(
          count /
          total *
          100
        )
      : 0;


  return `

    <div class="family-summary">

      <div class="family-count">

        <div class="family-count-number">
          ${count}/${total}
        </div>

        <div class="family-count-label">
          read today
        </div>

      </div>


      <div class="family-bar">

        <div
          class="family-bar-fill"
          style="width:${percent}%"
        ></div>

      </div>

    </div>


    <div class="family-grid">

      ${
        FAMILY.map(
          name => {

            const read =
              hasRead(
                state.hijri.day,
                name
              );


            const initials =
              name
                .split(/\s+/)
                .map(
                  x => x[0]
                )
                .join("")
                .slice(0,2)
                .toUpperCase();


            return `

              <div
                class="chip ${
                  read ? "read" : ""
                }"
              >

                <span class="avatar">
                  ${initials}
                </span>

                ${name}

              </div>

            `;

          }
        ).join("")
      }

    </div>

  `;

}


/* ============================================================
   MONTH PROGRESS
   ============================================================ */

function renderProgress(){

  const totalDays =
    daysInMonth();


  const total =
    totalDays *
    FAMILY.length;


  /*
   Only count rows belonging to known family
   members.

   This protects the progress display from
   accidental/old rows in the Sheet.
  */

  const completed =
    state.rows.filter(
      row =>
        FAMILY.includes(
          String(row.name)
        )
    ).length;


  const percent =
    total
      ? Math.round(
          completed /
          total *
          100
        )
      : 0;


  let days = "";


  for(
    let day = 1;
    day <= totalDays;
    day++
  ){

    const isToday =
      day === state.hijri.day;


    const count =
      FAMILY.filter(
        name =>
          hasRead(
            day,
            name
          )
      ).length;


    const dots =
      FAMILY.map(
        name => `

          <div
            class="person-dot ${
              hasRead(
                day,
                name
              )
                ? "read"
                : ""
            }"
            title="${name}"
          ></div>

        `
      ).join("");


    days += `

      <div
        class="day-row ${
          isToday ? "today" : ""
        }"
      >

        <div class="day-number">
          ${day}
        </div>

        <div class="day-dots">
          ${dots}
        </div>

        <div class="day-total">
          ${count}/${FAMILY.length}
        </div>

      </div>

    `;

  }


  return `

    <div class="progress-header">

      <div>

        <div class="progress-number">
          ${completed}/${total}
        </div>

        <div class="progress-label">
          family check-ins
        </div>

      </div>

      <div class="progress-percent">
        ${percent}%
      </div>

    </div>


    <div class="progress-bar">

      <div
        class="progress-fill"
        style="width:${percent}%"
      ></div>

    </div>


    <div class="day-list">

      ${days}

    </div>

  `;

}


/* ============================================================
   INDIVIDUAL PROGRESS
   ============================================================ */

function renderMembers(){

  const totalDays =
    daysInMonth();


  return FAMILY.map(
    name => {

      const count =
        state.rows.filter(
          row =>
            String(row.name) ===
            String(name)
        ).length;


      const percent =
        totalDays
          ? Math.min(
              100,
              Math.round(
                count /
                totalDays *
                100
              )
            )
          : 0;


      return `

        <div class="member-row">

          <div class="member-name">
            ${name}
          </div>

          <div class="member-bar">

            <div
              class="member-fill"
              style="width:${percent}%"
            ></div>

          </div>

          <div class="member-total">
            ${count}/${totalDays}
          </div>

        </div>

      `;

    }
  ).join("");

}


/* ============================================================
   UPDATED TEXT
   ============================================================ */

function renderUpdated(){

  if(!state.lastUpdated){

    return "";

  }


  const seconds =
    Math.round(
      (
        Date.now() -
        state.lastUpdated.getTime()
      ) / 1000
    );


  if(seconds < 5){

    return "Updated just now";

  }


  if(seconds < 60){

    return "Updated " +
      seconds +
      "s ago";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  return "Updated " +
    minutes +
    "m ago";

}


/* ============================================================
   RENDER
   ============================================================ */

function render(){

  const app =
    document.getElementById(
      "app"
    );


  if(!state.hijri){

    app.innerHTML =
      `<div class="loading">
        Loading…
      </div>`;

    return;

  }


  const day =
    state.hijri.day;


  const month =
    HIJRI_MONTHS[
      state.hijri.month - 1
    ];


  const read =
    state.name &&
    hasRead(
      day,
      state.name
    );


  let nameBlock;


  if(state.name){

    nameBlock = `

      <div class="you-line">

        Checking in as

        <strong>
          ${state.name}
        </strong>

        ·

        <button

          onclick="changeName()"
        >

        </button>

    `;

  }else{

      <div class="who-label">

      </div>

      <div class="who-grid">

        ${
          FAMILY.map(

              >

            `

        }

          state.busy

        }"

            : "✓ Read Juz " +

  }else{

      <button
        class="checkin-btn ${
          state.busy
            ? "busy"
            : ""
        }"

      >

            ? "Saving…"
            : "I read Juz " +
              day +
              " today"

      </button>

    `;

  }


  const totalDays =
    daysInMonth();


  app.innerHTML = `

    ${
      state.error
      ? `
        <div class="error-banner">
          ${state.error}
        </div>
      `
      : ""
    }


    <div class="top">

      <div class="hijri-date">

        ${month}
        ${state.hijri.year}H
        ·
        Day ${day}

      </div>


      <p class="title">
        Family Khatma
      </p>


      <div class="subtitle">
        One Juz together every day 🤍
      </div>


      <div class="updated">
        ${renderUpdated()}
      </div>

    </div>


    <div class="card juz-card">

      <div class="juz-label">
        Today's reading
      </div>


      <div class="juz-circle">

        <svg
          width="100"
          height="100"
          viewBox="0 0 112 112"
          style="
            position:absolute;
            top:0;
            left:0;
          "
        >

          <polygon
            points="
              56,4
              66,30
              94,26
              76,48
              100,64
              72,66
              76,94
              56,74
              36,94
              40,66
              12,64
              36,48
              18,26
              46,30
            "
            fill="#F3EFE4"
            stroke="#B8873A"
            stroke-width="2"
          />

        </svg>


        <div class="juz-number">
          ${day}
        </div>

      </div>


      <div class="juz-name">
        Juz ${day}
      </div>


      <a
        class="quran-link"
        href="https://quran.com/en/juz/${day}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read Juz ${day} on Quran.com →
      </a>


      ${button}


      ${nameBlock}

    </div>


    <div class="section-title">
      Today's family
    </div>


    <div class="card">

      ${renderToday()}

    </div>


    <div class="section-title">
      Family progress
    </div>


    <div class="card">

      ${renderProgress()}

    </div>


    <div class="section-title">
      Individual progress
    </div>


    <div class="card">

      <div class="member-list">

        ${renderMembers()}

      </div>

    </div>


    <div class="footer">

      ${totalDays} days ·
      ${totalDays} Juz

      <br>

      May Allah accept it from all of us 🤍

      <br>

      <button
        class="lock-link"
        onclick="logout()"
      >
        Lock tracker
      </button>

    </div>

  `;

}


/* ============================================================
   LOGOUT
   ============================================================ */

function logout(){

  try{

    localStorage.removeItem(
      "khatma_pin"
    );

  }catch(e){}


  showLogin();

}


/* ============================================================
   AUTOMATIC REFRESH
   ============================================================ */

/*
   This is what makes changes from OTHER family
   members appear automatically.

   Example:

   Mama checks in on her phone
           ↓
      Google Sheet
           ↓
   Your page polls every 10 seconds
           ↓
      refreshFromSheet()
           ↓
         render()
           ↓
   Mama appears as ✓
*/


setInterval(
  async function(){

    if(
      document.visibilityState !==
      "visible"
    ){

      return;

    }


    const pin =
      localStorage.getItem(
        "khatma_pin"
      );


    if(!pin){

      return;

    }


    if(
      state.busy ||
      state.refreshing
    ){

      return;

    }


    /*
     Make sure the Hijri date is still
     current in case the day changes while
     the page remains open.
    */

    const currentHijri =
      getHijri(
        new Date()
      );


    const newMonthKey =
      currentHijri.year +
      "-" +
      String(
        currentHijri.month
      ).padStart(
        2,
        "0"
      );


    /*
     If the Hijri day/month changed while
     the page was open, update the state.
    */

    if(
      currentHijri.day !==
        state.hijri.day ||
      newMonthKey !==
        state.monthKey
    ){

      state.hijri =
        currentHijri;

      state.monthKey =
        newMonthKey;

    }


    /*
     ALWAYS re-read the Sheet.

     This is what picks up another person's
     check-in or undo.
    */

    await refreshFromSheet();


    render();

  },
  10000
);
