<body>


<div
  id="app"
  class="wrap"
>

  <div class="loading">
    Loading Family Khatma…
  </div>

</div>


<script>


/* ============================================================
   ONLY THING TO CHANGE IN THIS FILE
   ============================================================ */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxCz8jJ92e8OdBoxXZjSqAnfyLbnMhIIXZ3E0YPCRy5Et0qWCGBDJhZNhNWvugMfq8s/exec";


/* ============================================================
   FAMILY MEMBERS
   ============================================================ */

const FAMILY = [

  "Mama",
  "Baba",
  "Menna",
  "Rahma",
  "Ahmed",
  "Ibrahim",
  "Ismail",
  "Mousa"

];


/* ============================================================
   HIJRI MONTHS
   ============================================================ */

const HIJRI_MONTHS = [

  "Muharram",
  "Safar",
  "Rabi' al-awwal",
  "Rabi' al-thani",
  "Jumada al-awwal",
  "Jumada al-thani",
  "Rajab",
  "Sha'ban",
  "Ramadan",
  "Shawwal",
  "Dhu al-Qi'dah",
  "Dhu al-Hijjah"

];


/* ============================================================
   STATE
   ============================================================ */

let state = {

  name:null,

  token:null,

  hijri:null,

  monthKey:"",

  rows:[],

  busy:false,

  error:null

};


/* ============================================================
   HIJRI DATE
   ============================================================ */

function getHijri(date){

  const parts =
    new Intl.DateTimeFormat(
      "en-u-ca-islamic-umalqura",
      {
        day:"numeric",
        month:"numeric",
        year:"numeric"
      }
    ).formatToParts(date);


  const map = {};


  parts.forEach(
    p => map[p.type] = p.value
  );


  return {

    day:Number(map.day),

    month:Number(map.month),

    year:Number(map.year)

  };

}


/* ============================================================
   STORAGE
   ============================================================ */

function loadStorage(){

  try{

    state.token =
      localStorage.getItem(
        "khatma_session"
      );

    state.name =
      localStorage.getItem(
        "khatma_name"
      );

  }catch(e){}

}


function saveName(name){

  state.name = name;

  try{

    localStorage.setItem(
      "khatma_name",
      name
    );

  }catch(e){}

  render();

}


function logout(){

  state.token = null;

  state.name = null;

  try{

    localStorage.removeItem(
      "khatma_session"
    );

    localStorage.removeItem(
      "khatma_name"
    );

  }catch(e){}

  showLogin();

}


/* ============================================================
   JSONP
   ============================================================ */

let callbackCounter = 0;


function request(url){

  return new Promise(
    (resolve,reject) => {

      const callbackName =
        "khatma_" +
        callbackCounter++;


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      const timer =
        setTimeout(
          () => {

            if(finished) return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "Request timed out"
              )
            );

          },
          15000
        );


      function cleanup(){

        clearTimeout(timer);

        try{

          delete window[
            callbackName
          ];

        }catch(e){}

        script.remove();

      }


      window[callbackName] =
        function(data){

          if(finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function(){

          if(finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "Request failed"
            )
          );

        };


      script.src =
        url +
        (url.includes("?")
          ? "&"
          : "?") +
        "callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


/* ============================================================
   LOGIN SCREEN
   ============================================================ */

function showLogin(message){

  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = `

    <div class="lock-screen">

      <div class="lock-icon">
        🌙
      </div>

      <p class="title">
        Family Khatma
      </p>

      <p>
        Enter the family PIN to open
        the tracker.
      </p>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        placeholder="PIN"
      >

      <button
        onclick="login()"
      >
        Unlock
      </button>

      ${
        message
        ? `
          <div class="lock-error">
            ${message}
          </div>
        `
        : ""
      }

    </div>

  `;


  const input =
    document.getElementById(
      "pin"
    );


  input.focus();


  input.addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        login();

      }

    }
  );

}


/* ============================================================
   LOGIN
   ============================================================ */

async function login(){

  const input =
    document.getElementById(
      "pin"
    );


  const pin =
    input.value.trim();


  if(!pin){

    showLogin(
      "Please enter the PIN."
    );

    return;

  }


  try{

    const result =
      await request(

        SCRIPT_URL +
        "?action=login" +
        "&pin=" +
        encodeURIComponent(pin)

      );


    if(
      !result ||
      !result.success ||
      !result.token
    ){

      showLogin(
        "That's not the right PIN."
      );

      return;

    }


    state.token =
      result.token;


    try{

      localStorage.setItem(
        "khatma_session",
        result.token
      );

    }catch(e){}


    load();

  }catch(e){

    showLogin(
      "Could not connect. Please try again."
    );

  }

}


/* ============================================================
   LOAD DATA
   ============================================================ */

async function load(){

  state.hijri =
    getHijri(
      new Date()
    );


  state.monthKey =
    state.hijri.year +
    "-" +
    String(
      state.hijri.month
    ).padStart(2,"0");


  if(!state.token){

    showLogin();

    return;

  }


  try{

    const result =
      await request(

        SCRIPT_URL +
        "?action=read" +
        "&monthKey=" +
        encodeURIComponent(
          state.monthKey
        ) +
        "&token=" +
        encodeURIComponent(
          state.token
        )

      );


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      logout();

      return;

    }


    if(
      result &&
      result.error
    ){

      state.error =
        "Could not load the tracker.";

      state.rows = [];

    }else{

      state.rows =
        Array.isArray(result)
        ? result
        : [];

      state.error = null;

    }


  }catch(e){

    state.error =
      "Could not connect to the Google Sheet.";

  }


  render();

}


/* ============================================================
   DAYS IN HIJRI MONTH
   ============================================================ */

function daysInMonth(){

  const current =
    state.hijri;


  const date =
    new Date();


  /*
   Check whether the Gregorian date corresponding
   to Hijri day 30 still belongs to this month.
   */

  date.setDate(
    date.getDate() +
    (30 - current.day)
  );


  const future =
    getHijri(date);


  if(
    future.month === current.month &&
    future.year === current.year
  ){

    return 30;

  }


  return 29;

}


/* ============================================================
   CHECK WHETHER PERSON READ
   ============================================================ */

function hasRead(
  day,
  name
){

  return state.rows.some(
    row =>
      Number(row.day) === Number(day) &&
      row.name === name
  );

}


/* ============================================================
   TODAY'S NAMES
   ============================================================ */

function todayReaders(){

  return FAMILY.filter(
    name =>
      hasRead(
        state.hijri.day,
        name
      )
  );

}


/* ============================================================
   UPDATE LOCAL STATE
   ============================================================ */

function addLocalCheckin(
  day,
  name
){

  if(
    hasRead(
      day,
      name
    )
  ){

    return;

  }


  state.rows.push({

    day:Number(day),

    name:name

  });

}


function removeLocalCheckin(
  day,
  name
){

  state.rows =
    state.rows.filter(
      row =>
        !(
          Number(row.day) ===
          Number(day) &&
          row.name === name
        )
    );

}


/* ============================================================
   CHECK IN
   ============================================================ */

async function checkin(){

  if(
    !state.name ||
    state.busy
  ){

    return;

  }


  const day =
    state.hijri.day;


  /*
   Optimistic UI update.
   */

  addLocalCheckin(
    day,
    state.name
  );


  state.busy = true;

  render();


  try{

    const result =
      await request(

        SCRIPT_URL +
        "?action=checkin" +
        "&monthKey=" +
        encodeURIComponent(
          state.monthKey
        ) +
        "&day=" +
        day +
        "&name=" +
        encodeURIComponent(
          state.name
        ) +
        "&token=" +
        encodeURIComponent(
          state.token
        )

      );


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      logout();

      return;

    }


    if(
      result &&
      result.error
    ){

      /*
       Server rejected it.
       Roll back optimistic update.
       */

      removeLocalCheckin(
        day,
        state.name
      );

      state.error =
        "Could not save your check-in.";

    }else{

      /*
       Server is source of truth.
       */

      state.rows =
        Array.isArray(result)
        ? result
        : state.rows;

      state.error = null;

    }


  }catch(e){

    removeLocalCheckin(
      day,
      state.name
    );

    state.error =
      "Could not save your check-in.";

  }


  state.busy = false;

  render();

}


/* ============================================================
   UNDO
   ============================================================ */

async function undo(){

  if(
    !state.name ||
    state.busy
  ){

    return;

  }


  const day =
    state.hijri.day;


  /*
   Optimistic update.
   */

  removeLocalCheckin(
    day,
    state.name
  );


  state.busy = true;

  render();


  try{

    const result =
      await request(

        SCRIPT_URL +
        "?action=undo" +
        "&monthKey=" +
        encodeURIComponent(
          state.monthKey
        ) +
        "&day=" +
        day +
        "&name=" +
        encodeURIComponent(
          state.name
        ) +
        "&token=" +
        encodeURIComponent(
          state.token
        )

      );


    if(
      result &&
      result.error ===
      "unauthorized"
    ){

      logout();

      return;

    }


    if(
      result &&
      result.error
    ){

      /*
       Roll back.
       */

      addLocalCheckin(
        day,
        state.name
      );

      state.error =
        "Could not undo the check-in.";

    }else{

      state.rows =
        Array.isArray(result)
        ? result
        : state.rows;

      state.error = null;

    }


  }catch(e){

    addLocalCheckin(
      day,
      state.name
    );

    state.error =
      "Could not undo the check-in.";

  }


  state.busy = false;

  render();

}


/* ============================================================
   RENAME
   ============================================================ */

function changeName(){

  state.name = null;


  try{

    localStorage.removeItem(
      "khatma_name"
    );

  }catch(e){}


  render();

}


/* ============================================================
   INITIALS
   ============================================================ */

function initials(name){

  return name
    .split(/\s+/)
    .slice(0,2)
    .map(
      x => x[0]
    )
    .join("")
    .toUpperCase();

}


/* ============================================================
   TODAY FAMILY HTML
   ============================================================ */

function renderTodayFamily(){

  const readers =
    todayReaders();


  const total =
    FAMILY.length;


  const count =
    readers.length;


  const percent =
    total
    ? Math.round(
        count / total * 100
      )
    : 0;


  const chips =
    FAMILY.map(
      name => {

        const read =
          readers.includes(
            name
          );


        return `

          <div
            class="chip ${
              read ? "read" : ""
            }"
          >

            <span class="avatar">
              ${initials(name)}
            </span>

            ${name}

          </div>

        `;

      }
    ).join("");


  return `

    <div class="family-summary">

      <div class="family-count">

        <div class="family-count-number">
          ${count}/${total}
        </div>

        <div class="family-count-label">
          read today
        </div>

      </div>


      <div class="family-bar">

        <div
          class="family-bar-fill"
          style="width:${percent}%"
        ></div>

      </div>

    </div>


    <div class="family-grid">

      ${chips}

    </div>

  `;

}


/* ============================================================
   MONTH PROGRESS
   ============================================================ */

function renderMonthProgress(){

  const totalDays =
    daysInMonth();


  const totalPossible =
    totalDays *
    FAMILY.length;


  const completed =
    state.rows.length;


  const percent =
    totalPossible
    ? Math.round(
        completed /
        totalPossible *
        100
      )
    : 0;


  let rows = "";


  for(
    let day = 1;
    day <= totalDays;
    day++
  ){

    const today =
      day === state.hijri.day;


    const dots =
      FAMILY.map(
        name => {

          const read =
            hasRead(
              day,
              name
            );


          return `

            <div
              class="person-dot ${
                read ? "read" : ""
              }"
              title="${name}"
            ></div>

          `;

        }
      ).join("");


    const count =
      FAMILY.filter(
        name =>
          hasRead(
            day,
            name
          )
      ).length;


    rows += `

      <div
        class="day-row ${
          today ? "today" : ""
        }"
      >

        <div class="day-number">
          ${day}
        </div>

        <div class="day-dots">
          ${dots}
        </div>

        <div class="day-total">
          ${count}/${FAMILY.length}
        </div>

      </div>

    `;

  }


  return `

    <div class="progress-header">

      <div>

        <div class="progress-number">
          ${completed}/${totalPossible}
        </div>

        <div class="progress-label">
          family check-ins this month
        </div>

      </div>


      <div class="progress-percent">
        ${percent}%
      </div>

    </div>


    <div class="progress-bar">

      <div
        class="progress-fill"
        style="width:${percent}%"
      ></div>

    </div>


    <div class="day-list">

      ${rows}

    </div>

  `;

}


/* ============================================================
   INDIVIDUAL PROGRESS
   ============================================================ */

function renderMembers(){

  const totalDays =
    daysInMonth();


  return FAMILY.map(
    name => {

      const completed =
        state.rows.filter(
          row =>
            row.name === name
        ).length;


      const percent =
        totalDays
        ? Math.round(
            completed /
            totalDays *
            100
          )
        : 0;


      return `

        <div class="member-row">

          <div class="member-name">
            ${name}
          </div>


          <div class="member-bar">

            <div
              class="member-fill"
              style="width:${percent}%"
            ></div>

          </div>


          <div class="member-total">
            ${completed}/${totalDays}
          </div>

        </div>

      `;

    }
  ).join("");

}


/* ============================================================
   MAIN RENDER
   ============================================================ */

function render(){

  const app =
    document.getElementById(
      "app"
    );


  if(!state.hijri){

    app.innerHTML = `

      <div class="loading">
        Loading…
      </div>

    `;

    return;

  }


  const day =
    state.hijri.day;


  const monthName =
    HIJRI_MONTHS[
      state.hijri.month - 1
    ];


  const read =
    state.name
    ? hasRead(
        day,
        state.name
      )
    : false;


  let nameHtml;


  if(state.name){

    nameHtml = `

      <div class="you-line">

        Checking in as

        <strong>
          ${state.name}
        </strong>

        ·

        <button
          class="text-button"
          onclick="changeName()"
        >
          not you?
        </button>

      </div>

    `;

  }else{

    nameHtml = `

      <div class="who-label">
        Who's checking in?
      </div>


      <div class="who-grid">

        ${
          FAMILY.map(
            name => `

              <button
                class="who-btn"
                onclick="saveName('${name}')"
              >
                ${name}
              </button>

            `
          ).join("")
        }

      </div>

    `;

  }


  let actionHtml;


  if(read){

    actionHtml = `

      <button
        class="checkin-btn done ${
          state.busy ? "busy" : ""
        }"
        onclick="undo()"
      >

        ${
          state.busy
          ? "Saving…"
          : "✓  Read Juz " + day + " today"
        }

      </button>


      <button
        class="undo-btn"
        onclick="undo()"
        ${state.busy ? "disabled" : ""}
      >

        Undo

      </button>

    `;

  }else{

    actionHtml = `

      <button
        class="checkin-btn ${
          state.busy ? "busy" : ""
        }"
        onclick="checkin()"
      >

        ${
          state.busy
          ? "Saving…"
          : "I read Juz " + day + " today"
        }

      </button>

    `;

  }


  app.innerHTML = `


    <!-- ======================================================
         HEADER
         ====================================================== -->

    <div class="top">

      <div class="hijri-date">

        ${monthName}
        ${state.hijri.year}H
        ·
        Day ${day}

      </div>


      <p class="title">
        Family Khatma
      </p>


      <div class="subtitle">
        One Juz together every day 🤍
      </div>

    </div>


    <!-- ======================================================
         TODAY'S JUZ
         ====================================================== -->

    <div class="card juz-card">

      <div class="juz-label">
        Today's reading
      </div>


      <div class="juz-circle">

        <svg
          width="100"
          height="100"
          viewBox="0 0 112 112"
          style="
            position:absolute;
            top:0;
            left:0;
          "
        >

          <polygon
            points="
              56,4
              66,30
              94,26
              76,48
              100,64
              72,66
              76,94
              56,74
              36,94
              40,66
              12,64
              36,48
              18,26
              46,30
            "
            fill="#F3EFE4"
            stroke="#B8873A"
            stroke-width="2"
          />

        </svg>


        <div class="juz-number">
          ${day}
        </div>

      </div>


      <div class="juz-name">
        Juz ${day}
      </div>


      <a
        class="quran-link"
        href="https://quran.com/en/juz/${day}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read Juz ${day} on Quran.com →
      </a>


      ${actionHtml}


      ${nameHtml}

    </div>


    <!-- ======================================================
         TODAY'S FAMILY
         ====================================================== -->

    <div class="section-title">
      Today's family
    </div>


    <div class="card">

      ${renderTodayFamily()}

    </div>


    <!-- ======================================================
         MONTH PROGRESS
         ====================================================== -->

    <div class="section-title">
      Family progress
    </div>


    <div class="card">

      ${renderMonthProgress()}

    </div>


    <!-- ======================================================
         INDIVIDUAL PROGRESS
         ====================================================== -->

    <div class="section-title">
      Individual progress
    </div>


    <div class="card">

      <div class="member-list">

        ${renderMembers()}

      </div>

    </div>


    <!-- ======================================================
         FOOTER
         ====================================================== -->

    <div class="footer">

      ${daysInMonth()} days ·
      ${daysInMonth()} Juz

      <br>

      May Allah accept it from all of us 🤍


      <br>


      <button
        class="lock-link"
        onclick="logout()"
      >
        Lock tracker
      </button>

    </div>


  `;

}


/* ============================================================
   START
   ============================================================ */

loadStorage();


if(
  state.token &&
  SCRIPT_URL.indexOf(
    "PASTE_YOUR"
  ) === -1
){

  load();

}else{

  showLogin();

}

</script>

</body>
